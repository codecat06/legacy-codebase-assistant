services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=codeintel'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d codeintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: 'qdrant/qdrant:latest'
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    image: 'ollama/ollama:latest'
    ports:
      - '11434:11434'
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  qdrantdata:
  ollamadata: